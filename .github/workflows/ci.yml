# CI added by the independent audit (see audit/SECURITY_AND_RELEASE_AUDIT.md).
# No secrets are required; LLM-dependent evaluation is intentionally NOT run in CI.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU-only torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[dev]"
      - name: Fetch pinned embedding model (checksum-verified)
        run: python -m app.retrieval.fetch_models
      - name: Unit + integration tests (Docling-model tests excluded; audit reproductions run as strict xfail)
        run: pytest -q -m "not docling_models"
      - name: OpenAPI is up to date
        run: |
          FINAUDIT_DATA_DIR=$(mktemp -d) python -c "import json; from app.main import app; print(json.dumps(app.openapi(), indent=2))" > /tmp/openapi.json
          diff <(python -m json.tool docs/openapi.json) <(python -m json.tool /tmp/openapi.json)
      - name: Frontend/backend API contract (types.ts vs OpenAPI)
        run: PYTHONPATH=. python eval/audit/contract_check.py --strict

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true   # informational until the pre-existing advisories are triaged
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Frontend advisories (bun audit; 28 pre-existing, see audit/milestone-3.5)
        continue-on-error: true
        run: bun install --frozen-lockfile && bun audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend advisories (pip-audit)
        continue-on-error: true
        run: pip install pip-audit && pip-audit -r <(pip install --dry-run --quiet --report - ./services/api 2>/dev/null | python -c "import json,sys; [print(f\"{i['metadata']['name']}=={i['metadata']['version']}\") for i in json.load(sys.stdin)['install']]")
        shell: bash
