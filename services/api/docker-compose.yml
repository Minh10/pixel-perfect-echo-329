# Local development stack: API + background worker(s) + Qdrant, sharing one data volume.
#   docker compose up --build
#   API:   http://localhost:8000/api/v1/health      OpenAPI docs: http://localhost:8000/docs
# Ports are bound to 127.0.0.1 only: the API has no authentication yet and must stay private.
services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

  api:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        DOCLING_PRELOAD_MODELS: ${DOCLING_PRELOAD_MODELS:-true}
        INSTALL_DEV: ${INSTALL_DEV:-true}
    image: finaudit-api:dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FINAUDIT_DATA_DIR: /data
      FINAUDIT_QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      - finaudit-data:/data

  worker:
    image: finaudit-api:dev
    depends_on:
      - api            # api builds the shared image
      - qdrant
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      FINAUDIT_DATA_DIR: /data
      FINAUDIT_QDRANT_URL: http://qdrant:6333
    volumes:
      - finaudit-data:/data
    healthcheck:
      disable: true
    stop_grace_period: 60s   # let an in-flight PDF finish
    # Scale horizontally with: docker compose up --scale worker=2

volumes:
  finaudit-data:
  qdrant-data:
